[package]
name = "sb-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The SmileBASIC 4 machine without a window: commands, screens, sprites, sound, files and the editor"
rust-version.workspace = true

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
hmac = "0.12"
jpeg-encoder = "0.7.1"
klattsch-core = "0.1.2"
miniz_oxide = "0.9.1"
png = "0.18.1"
rustysynth = "1.3.8"
sb-core.workspace = true
sha1 = "0.10"
zune-jpeg = "0.5.15"

[build-dependencies]
ab_glyph = "0.2.32"
miniz_oxide = "0.9.1"

[features]
# See sb-core.
unchecked-vars = ["sb-core/unchecked-vars"]
jit = ["sb-core/jit"]

[lints]
workspace = true
