[package]
name = "sb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sb-jit = { workspace = true, optional = true }
stacker = "0.1.25"

[features]
# Reads and writes the fused code's variables without a bounds check on
# each. Off by default: see docs/development/security.md before turning it on.
unchecked-vars = []
# Runs the fused code's hot loops as native code. Off by default: see
# docs/performance/jit-design.md and docs/development/security.md before turning it on.
jit = ["dep:sb-jit"]

[lints]
workspace = true
