[package]
name = "sb-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "smilebasic-check: runs SmileBASIC 4 programs with no window, to compare and to measure"
rust-version.workspace = true

[[bin]]
name = "smilebasic-check"
path = "src/main.rs"

[dependencies]
sb-profiles.workspace = true
sb-runtime.workspace = true

[features]
# See sb-core.
unchecked-vars = ["sb-runtime/unchecked-vars"]
jit = ["sb-runtime/jit"]

[lints]
workspace = true
