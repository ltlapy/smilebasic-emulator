[package]
name = "sb-sdl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "smilebasic: an emulator for SmileBASIC 4 programs"
rust-version.workspace = true

[[bin]]
name = "smilebasic"
path = "src/main.rs"

[dependencies]
sb-core.workspace = true
sb-runtime.workspace = true
sb-profiles.workspace = true

sdl3.workspace = true

[features]
# See sb-core.
unchecked-vars = ["sb-core/unchecked-vars", "sb-runtime/unchecked-vars"]
jit = ["sb-core/jit", "sb-runtime/jit"]

[lints]
workspace = true
